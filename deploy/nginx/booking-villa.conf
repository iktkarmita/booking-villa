# Nginx untuk Booking Villa: domain induk + semua subdomain tenant (wildcard).
# Ganti domainkamu.com dan path /var/www/booking-villa. PHP-FPM: sesuaikan versi socket.

server {
    listen 80;
    listen [::]:80;
    server_name domainkamu.com *.domainkamu.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name domainkamu.com *.domainkamu.com;

    root /var/www/booking-villa/public;
    index index.php;
    charset utf-8;

    # Sertifikat wildcard (lihat docs/DEPLOY.md, certbot DNS-01)
    ssl_certificate     /etc/letsencrypt/live/domainkamu.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/domainkamu.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Bukti pembayaran maks. 4 MB + overhead
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 60s;
    }

    # Aset ber-hash dari Vite & Filament boleh di-cache lama
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|webp|ico)$ {
        expires 30d;
        access_log off;
        try_files $uri =404;
    }

    # Jangan layani file tersembunyi (kecuali .well-known)
    location ~ /\.(?!well-known) {
        deny all;
    }
}
