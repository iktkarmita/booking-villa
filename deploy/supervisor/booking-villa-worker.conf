; Salin ke /etc/supervisor/conf.d/ lalu: supervisorctl reread && supervisorctl update
[program:booking-villa-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/booking-villa/artisan queue:work --sleep=3 --tries=3 --max-time=3600
directory=/var/www/booking-villa
user=www-data
numprocs=2
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/booking-villa/storage/logs/worker.log
